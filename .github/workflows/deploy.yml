name: Website CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check website
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Check webpage content
        run: |
          test -s index.html
          grep -qi '<title>CI/CD Practical</title>' index.html
          grep -qi '<h1>Welcome to My CI/CD Website</h1>' index.html
          echo "PASS: Webpage exists and required content is present."

  deploy:
    name: Deploy website
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
